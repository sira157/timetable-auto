<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ระบบจัดตารางสอนอัตโนมัติ</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --text: #1e293b;
        --brand: #4f46e5;
        --card: #ffffff;
        --line: #e2e8f0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: "Sarabun", "Noto Sans Thai", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0; color: #64748b; font-size: 14px; }
      .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 2px 10px;
        border-radius: 999px;
        background: #eef2ff;
        color: var(--brand);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>🗓 ระบบจัดตารางสอนอัตโนมัติ</h1>
      <p>ระบบพร้อมใช้งานเบื้องต้น กำลังพัฒนาหน้าจัดตารางและระบบเข้าสู่ระบบ</p>
      <span class="badge" id="status">กำลังตรวจสอบสถานะ…</span>
    </main>
    <script>
      fetch("/api/health")
        .then((r) => r.json())
        .then(() => (document.getElementById("status").textContent = "เชื่อมต่อเซิร์ฟเวอร์แล้ว"))
        .catch(() => (document.getElementById("status").textContent = "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"));
    </script>
  </body>
</html>
