services:
  - type: web
    name: timetable-auto
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TIMETABLE_ADMIN_PASSWORD
        sync: false
      - key: TIMETABLE_DATA_DIR
        value: /tmp/timetable-data
